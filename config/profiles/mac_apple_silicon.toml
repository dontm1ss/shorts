# DEV-машина: macOS на Apple Silicon (M1/M2/M3/M4)
# CUDA и NVENC недоступны — TTS на MPS (Metal), whisper на CPU, кодирование через VideoToolbox.

[profile]
name = "mac_apple_silicon"
description = "macOS + Apple Silicon — разработка/тесты"
deploy_target = false
priority = 50

[match]
os = "Darwin"
arch = "arm64"

[install]
torch_index_url = ""   # стандартный PyPI — сборки для macOS уже с MPS

[tts]
device = "mps"

[tts.env]
# Операции, которых нет в MPS, уходят на CPU вместо падения
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[subtitles]
device = "cpu"   # у CTranslate2 нет бэкенда Metal
compute_type = "int8"

[render]
encoder = "h264_videotoolbox"
encoder_args = ["-q:v", "65"]
hwaccel = "videotoolbox"

[runtime]
cpu_threads = 0
