# Общие настройки для всех машин. Профиль железа (config/profiles/*.toml)
# накладывается поверх: совпадающие ключи профиля перекрывают эти значения.

[video]
# Вертикальный формат 9:16
width = 1080
height = 1920
fps = 30
pix_fmt = "yuv420p"
audio_codec = "aac"
audio_bitrate = "192k"

[clipper]
window_s = 30   # длина сегмента
step_s = 2      # шаг между стартами соседних сегментов
write_files = true   # сохранять сегменты отдельными mp4 (финальный рендер всё равно берёт кадры из исходника)
video_extensions = [".mp4", ".mkv", ".mov", ".avi", ".webm"]

[story]
min_duration_s = 50
max_duration_s = 60
target_duration_s = 55
# Темп озвучки: из него — бюджет слов в промптах DeepSeek и оценка длины до синтеза. Замер на записях
# голосов владельца (2026-09-15, 26 озвученных сцен): медиана 2.8 слова/с (истории 2.82, переписки 2.73)
# + ~0.3 с на реплику. С прежними 3.4 (встроенный голос) DeepSeek писал на ~20% длиннее — ролики выходили
# 55–73 с вместо 50–60. Точный хронометраж проверяется после TTS.
words_per_second = 2.8
line_overhead_s = 0.3
max_fit_rounds = 3      # сколько раз переписывать текст под хронометраж

[paths]
source_videos = "data/source-videos"
output = "output"
processed_forum_ids = "data/processed-forum-ids.json"
scripting_history = "data/scripting-history.json"   # для разнообразия историй/переписок (scripting.params)
manifest = "output/manifest.json"                   # список готовых роликов (pipeline.manifest)
deepseek_state = "output/deepseek-state.json"       # основная модель DeepSeek недавно не ответила (scripting/client.py)

[deepseek]
base_url = "https://api.deepseek.com"
# Основная модель — быстрая flash. Если она не ответила за timeout_s или вернула ошибку, запрос
# уходит в запасную v4-pro (рассуждающая: сначала думает, потом отвечает; temperature игнорирует),
# и следующие fallback_cooldown_s секунд все запросы сразу идут в запасную, потом снова пробуем flash.
# (deepseek-chat из API убран; 2026-09-14 flash висела без ответа, v4-pro отвечала.)
model = "deepseek-flash"
fallback_model = "deepseek-v4-pro"
fallback_cooldown_s = 600
temperature = 1.0
# Сколько ждать начала ответа. При перегрузке DeepSeek не отвечает ошибкой, а держит соединение
# пустыми строками до 30 минут — после timeout_s без текста запрос перезапускается (scripting/client.py).
# Начавшийся ответ не обрывается, пока текст идёт.
timeout_s = 60
max_retries = 3
# Нет связи с DeepSeek (VPN переподключается, прокси отказывает) — ждать до network_wait_s,
# не тратя попытки и не переключаясь на запасную модель.
network_wait_s = 300
# api_key — только из .env (DEEPSEEK_API_KEY)

[tts]
language_id = "ru"
# Синтез по предложениям, а не абзацами: экономит VRAM и избегает
# нестабильности модели на длинных входах.
max_chars_per_chunk = 300
# Отдельный процесс для TTS (docs/tts-stack-spec.md, раздел 1)
isolated_process = true
pause_between_lines_ms = 350    # пауза между репликами сценария
silent_line_ms = 600            # сообщение из одних эмодзи не озвучивается — пауза, чтобы пузырь успели увидеть
pause_between_chunks_ms = 150   # пауза между кусками одной длинной реплики
trim_top_db = 40                # обрезка тишины по краям каждого куска
seed = 42                       # фиксированный seed — повторяемость при подборе пресетов
# Повторная генерация, если кусок не прошёл проверку (tts-stack-spec, раздел 8)
max_retries = 2
# Проверка каждого куска whisper'ом: обрезка по последнему распознанному слову (модель
# после речи дописывает 2–3 с шума/бормотания) + повтор, если текст распознан плохо
verify = true
max_text_error = 0.25   # доля несовпадения букв распознанного и заданного текста

# Пресет по умолчанию для каждого формата. По проверке whisper'ом чище всего звучит neutral:
# energetic и calm искажали слова на тестовой фразе — уточнить после прослушивания.
[tts.scene_presets]
reddit_story = "neutral"
imessage_drama = "neutral"
video_clip = "neutral"

# Референс-голоса, путь от корня репозитория: папка с записями по эмоциям
# (<эмоция>.wav — neutral, anger, sad, sarcasm, anxious, shock, joy, tired, warm, guilty;
# docs/voice-phrases.md) или один wav на все эмоции.
# Голос реплики: явный голос роли (narrator / A / B) → голос по полу героя (female / male;
# пол определяет DeepSeek при написании сценария — meta.genders сцены) → встроенный голос Chatterbox.
# Из папки берётся запись с эмоцией реплики (script[].emotion), нет её — neutral.wav, нет и его —
# любая запись из папки. Проверить папки: venv\Scripts\python -m tts voices
[tts.voices]
female = "voices/female"
male = "voices/male"
narrator = ""
A = ""
B = ""
# Второй набор записей пола — для второго героя того же пола (две женщины / двое мужчин в переписке).
# Пусто или папки нет — второму герою сдвигается высота тех же записей ([tts.second_voice]).
female_2 = ""
male_2 = ""

# Два героя одного пола иначе звучали бы одним голосом. Роль, заговорившая первой, остаётся со своим,
# второй — те же записи со сдвигом высоты вместе с формантами (другой «размер» голоса), в полутонах:
# минус — ниже, плюс — выше. 0 — не менять. Третьему такому герою — сдвиг в другую сторону.
# Замер на модели (2026-09-15): похожесть на исходный голос по эмбеддингу диктора 0.75 (мужской +2.5,
# основной тон 105 → 134 Гц) и 0.71 (женский −2.5, 218 → 188 Гц); тот же голос на другой фразе — 0.90,
# мужской и женский — 0.62; разборчивость (whisper) не меняется. Вниз для мужского (0.78, 105 → 97 Гц)
# и вверх для женского (0.82) — заметно слабее.
[tts.second_voice]
male = 2.5
female = -2.5

# Поправки подачи по эмоции реплики — прибавляются к пресету формата (tts.presets).
# Эмоцию несёт в первую очередь сама запись-референс, поэтому поправки небольшие: высокий
# exaggeration по проверке whisper'ом искажает слова. Стартовые значения — уточнить на слух:
#   venv\Scripts\python -m tts emotions "Фраза для сравнения" --gender male
[tts.emotions]
neutral = {}
anger = { exaggeration = 0.15 }
sad = { exaggeration = -0.1, cfg_weight = -0.1 }
sarcasm = { exaggeration = 0.05, cfg_weight = -0.05 }
anxious = { exaggeration = 0.15 }
shock = { exaggeration = 0.15 }
joy = { exaggeration = 0.15 }
tired = { exaggeration = -0.15, cfg_weight = -0.1 }
warm = { exaggeration = -0.1, cfg_weight = -0.05 }
guilty = {}

# Стартовые пресеты подачи (docs/tts-stack-spec.md, раздел 9) — уточняются в задаче 3
[tts.presets.neutral]
exaggeration = 0.5
cfg_weight = 0.5
temperature = 0.8

[tts.presets.energetic]
exaggeration = 0.7
cfg_weight = 0.5
temperature = 0.8

[tts.presets.calm]
exaggeration = 0.3
cfg_weight = 0.35
temperature = 0.7

[subtitles]
engine = "faster-whisper"
model = "small"
language = "ru"
clip_language = "auto"   # язык клипов-исходников: auto = определить по звуку
# Группы слов на экране (TikTok-стиль: 1–3 слова, текущее подсвечено)
max_words = 3
max_chars = 16
max_gap_s = 0.6          # пауза длиннее — новая группа
uppercase = true

[subtitles.style]
font = "Arial Black"
size = 92
color = "#FFFFFF"
highlight_color = "#FFE600"   # текущее слово
outline_color = "#000000"
outline = 6
shadow = 3
pop_scale = 115               # «прыжок» текущего слова, % от размера

# Разнообразие оформления: каждой сцене — свой шрифт и цвет подсветки (выбор детерминирован
# от scene_id и сохраняется в meta.style — перерендер даёт тот же вид). Шрифты — только те,
# что есть и в Windows 10/11, и в macOS. size — размер под этот шрифт (ширина букв разная).
[subtitles.variety]
enabled = true
fonts = [
  { name = "Arial Black", size = 92 },
  { name = "Impact", size = 108 },
  { name = "Verdana", size = 86 },
  { name = "Trebuchet MS", size = 96 },
  { name = "Tahoma", size = 94 },
]
highlight_colors = ["#FFE600", "#39FF14", "#00E5FF", "#FF4FD8", "#FF9F1A"]

# Вертикальный центр субтитров по раскладкам (кадр 1080×1920)
[subtitles.position_y]
full_bg = 1060       # история на паркуре — чуть ниже центра
top_bottom = 960     # клип сверху / паркур снизу — ровно на стыке
ui_over_bg = 1590    # iMessage сверху — по центру паркура под интерфейсом

[imessage]
me_speaker = "B"             # владелец телефона — синие пузыри справа; остальные — серые слева
theme = "light"              # light | dark
css_width = 360              # ширина «телефона» в CSS-пикселях: кадр 1080 → масштаб ×3
typing_ms = 1400             # сколько собеседник «печатает» перед сообщением
min_gap_ms = 350             # индикатор набора — не раньше, чем через столько после прошлого сообщения
browser_channel = "msedge"   # системный браузер для Playwright: msedge | chrome | chromium (скачанный)

# Пул фоновых видео нижнего слоя (full_bg/top_bottom/ui_over_bg) — на каждую сцену
# (compositor.pick_background) случайно выбирается одно и случайный отрезок из него.
# Добавить новое: скопировать блок, name — короткий идентификатор (пишется в scene.background.type).
[[backgrounds]]
name = "parkour_minecraft"
path = "parkur.mp4"

[[backgrounds]]
name = "subway_surfers"
path = "subway.mp4"

[cleanup]
# После успешного рендера — удалить тяжёлые промежуточные файлы сцены (output/work/<scene_id>/).
# ui.mov (запись переписки с прозрачностью) весит сотни МБ; при перерендере он пишется заново.
# voice.wav и субтитры остаются — по ним ролик перерендеривается без повторной озвучки.
after_render = ["ui.mov", "clip_audio.wav"]

[review]
# Отбор сценариев: после DeepSeek сценарий ждёт решения в веб-панели (python -m panel) —
# на озвучку и рендер уходят только одобренные. false — сразу в работу, как раньше.
enabled = true
# Автоодобрение по умолчанию; в панели переключается на лету (хранится в output/review-state.json).
auto_approve = false

# Оценка сценария DeepSeek-редактором сразу после генерации: крючок, повороты, концовка (у петли — стык),
# язык и общая, 1–10; видна в панели. Ниже min_score — сценарий переписывается по замечаниям редактора
# (до rewrite_attempts раз, остаётся лучший вариант); всё ещё ниже — сразу в «Отклонённые» (можно вернуть),
# в работу не идёт даже при автоодобрении.
[scoring]
enabled = true
min_score = 6
rewrite_attempts = 1

[panel]
host = "127.0.0.1"   # только локально; наружу — через туннель на сервер (docs/panel-deploy.md)
port = 8765
user = "admin"       # пароль — PANEL_PASSWORD в .env; без него панель пускает всех (только localhost!)
# Сторож: раз в столько секунд панель проверяет обработчик очереди — есть задачи, а он не запущен
# (упал, ПК перезагрузился) — запускает и пишет в Telegram. 0 — выключить.
watchdog_s = 60

# Уведомления в Telegram: упавшие задачи, готовые ролики, сценарии на проверке, перезапуск обработчика.
# Токен бота и чат — в .env (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID): venv\Scripts\python -m notify setup
[notify]
enabled = true
# Бот в потоке панели: сценарии на проверку с кнопками «Одобрить / Отклонить / Переписать», готовые ролики —
# видео с текстами для публикации и кнопкой «Часть 2», /status. Тогда обработчик сам шлёт только сбои.
bot = true
panel_url = "https://v3242400.hosted-by-vdsina.ru"   # ссылка на панель в сообщениях
failures_batch_s = 30      # упавшие задачи — одним сообщением через столько секунд после первой
ready_digest_min = 60      # готовые ролики, пока очередь не опустела, — не чаще раза в столько минут

[compositor]
clip_fit = "cover"        # cover — заполнить область с обрезкой краёв; contain — вписать на размытом фоне
ui_height = 1260          # высота интерфейса iMessage сверху (кратна 3), ниже — паркур
tail_ms = 700             # хвост ролика после конца озвучки (у петли хвоста нет — пауза как между репликами)
loop_crossfade_ms = 800   # петля: столько в конце фон плавно переходит в кадры перед своим началом — стык не виден
loudnorm = "I=-14:TP=-1.5:LRA=11"   # громкость под площадки коротких видео
subtitles_for = ["reddit_story", "video_clip"]   # в iMessage текст уже в пузырях

[compositor.layout]
reddit_story = "full_bg"       # паркур на весь кадр + субтитры
video_clip = "top_bottom"      # клип сверху, паркур снизу
imessage_drama = "ui_over_bg"  # интерфейс переписки сверху, паркур снизу

[render]
# Потолок размера ролика: битрейт ограничивается по длительности. Бот Telegram отправляет файлы до 50 МБ,
# а TikTok и Shorts всё равно пережимают (раньше ролики выходили 60–100 МБ). 0 — без потолка.
max_size_mb = 48
# Запасной CPU-энкодер, если аппаратный недоступен
fallback_encoder = "libx264"
fallback_encoder_args = ["-preset", "veryfast", "-crf", "21"]

[queue]
# Тяжёлые задачи (TTS, whisper, рендер) строго последовательно — на всех машинах,
# чтобы тесты на dev-машинах вели себя так же, как на целевом железе.
max_parallel_jobs = 1
# Сценарии DeepSeek (ожидание ответа по сети, не GPU) — своей линией параллельно тяжёлым задачам:
# одобренное сразу идёт в озвучку и рендер, не дожидаясь генерации новых сценариев.
# false — одна линия, сценарии берутся, когда обработке нечего делать.
light_lane = true
db = "output/queue.sqlite"
max_attempts = 2
# Сколько готовых задач озвучки выполнять одним процессом (модели TTS и whisper грузятся один раз
# на пачку). 1 — каждая сцена сразу после озвучки идёт в рендер: первые ролики готовы через минуты,
# а не после озвучки всего одобренного; цена — загрузка модели на каждую сцену (десятки секунд).
tts_batch_size = 1

[scraper]
# Публичная RSS-лента Reddit (без авторизации; JSON без OAuth закрыт — 403, у RSS жёсткий лимит).
# Посты на английском — DeepSeek адаптирует их на русский.
subreddits = ["tifu", "pettyrevenge", "MaliciousCompliance", "ProRevenge", "AmItheAsshole", "entitledparents"]
sort = "top"            # top | hot | new
time_filter = "week"    # для top: day | week | month | year | all
limit = 50              # постов на сабреддит за запрос
min_chars = 800         # короче — не хватит материала на 50–60 с
max_chars = 9000
exclude_nsfw = true     # не лексический фильтр: NSFW-посты — риск страйка на площадках
request_delay_s = 8
user_agent = "windows:shorts-content-pipeline:v0.1"
posts_dir = "data/forum-posts"

[runtime]
cpu_threads = 0                     # 0 = автоопределение
unload_models_between_jobs = false
