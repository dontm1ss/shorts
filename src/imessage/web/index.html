<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iMessage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone" class="light">
  <div id="statusbar">
    <span id="clock">21:48</span>
    <span class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.2c2.2 0 4.2.8 5.7 2.2l1.1-1.1A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .7 3.3l1.1 1.1a8 8 0 0 1 5.7-2.2Zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3Zm0 3.1c.5 0 .9.2 1.2.5L7.5 10.2 6.3 9c.3-.3.7-.5 1.2-.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" fill="none" stroke-opacity=".4" stroke-width="1"/><rect class="battery-level" x="2" y="2" width="15" height="8" rx="2"/><path d="M23 4v4a2 2 0 0 0 0-4Z" opacity=".45"/></svg>
    </span>
  </div>

  <div id="header">
    <div class="back">
      <svg width="11" height="19" viewBox="0 0 11 19"><path d="M9.5 1.5 2 9.5l7.5 8" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="badge">12</span>
    </div>
    <div class="contact">
      <div id="avatar">Л</div>
      <div class="name"><span id="name">Контакт</span><svg width="6" height="10" viewBox="0 0 6 10"><path d="m1 1 4 4-4 4" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    </div>
    <div class="facetime">
      <svg width="26" height="17" viewBox="0 0 26 17"><rect x="1" y="1.5" width="16" height="14" rx="3.5" fill="none" stroke-width="1.9"/><path d="M18.5 6.5 24 3v11l-5.5-3.5Z" fill="none" stroke-width="1.9" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div id="viewport"><div id="list"></div></div>

  <div id="inputbar">
    <div class="plus"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14"/><path d="M15 9v12M9 15h12" stroke-width="2.2" stroke-linecap="round"/></svg></div>
    <div class="field">
      <span id="typed"></span><span id="caret"></span><span id="placeholder">iMessage</span>
      <span id="mic"><svg width="12" height="18" viewBox="0 0 12 18"><rect x="3" y="0.8" width="6" height="10.5" rx="3"/><path d="M1 8.5a5 5 0 0 0 10 0M6 13.5V17" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg></span>
      <span id="send"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="14"/><path d="M14 20V8.5M8.8 13.3 14 8l5.2 5.3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
