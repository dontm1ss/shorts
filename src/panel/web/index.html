<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts — отбор сценариев</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- Вход. Пока не вошли, остальная страница скрыта: панель смотрит наружу через туннель. -->
<section id="login" class="login" hidden>
  <form id="login-form">
    <h1>Shorts</h1>
    <label>Логин<input name="login" autocomplete="username" required autofocus></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Войти</button>
    <div id="login-error" class="login-error" hidden></div>
  </form>
</section>

<div id="app" hidden>
<header class="top">
  <div class="brand">Shorts<span>отбор сценариев</span></div>
  <div class="worker">
    <a id="tg-connect" class="tg" target="_blank" rel="noopener noreferrer" hidden
       title="Откроет бота в Telegram — нажмите «Старт», и сценарии с роликами начнут приходить туда">Подключить Telegram</a>
    <span id="worker-state" class="dot"></span>
    <button id="worker-start" class="ghost" hidden>Запустить обработку</button>
    <span id="who" class="who"></span>
    <button id="logout" class="ghost">Выйти</button>
  </div>
</header>

<section class="generate">
  <form class="gen" data-kind="story">
    <label>Истории</label>
    <input type="number" name="count" min="1" max="20" value="3" aria-label="сколько историй">
    <input type="text" name="topic" placeholder="тема — необязательно" class="topic">
    <button type="submit">Сгенерировать</button>
  </form>
  <form class="gen" data-kind="drama">
    <label>Переписки</label>
    <input type="number" name="count" min="1" max="20" value="3" aria-label="сколько переписок">
    <input type="text" name="topic" placeholder="тема — необязательно" class="topic">
    <label class="loop-check" title="Конец переписки переходит в начало: ролик крутится по кругу, и зритель не сразу замечает, что смотрит второй раз">
      <input type="checkbox" name="loop"> ↻ петля</label>
    <button type="submit">Сгенерировать</button>
  </form>
  <label class="auto" id="auto-row" hidden>
    <input type="checkbox" id="auto-approve" role="switch">
    <span class="switch" aria-hidden="true"></span>
    <span class="auto-text"><b>Автоодобрение</b>
      <span>новые сценарии сразу идут в озвучку и рендер, без проверки</span></span>
  </label>
</section>

<nav class="tabs" role="tablist">
  <button data-tab="pending" class="active">На проверке <b id="n-pending"></b></button>
  <button data-tab="videos">Готовые <b id="n-videos"></b></button>
  <button data-tab="queue">Очередь <b id="n-queue"></b></button>
  <button data-tab="rejected">Отклонённые <b id="n-rejected"></b></button>
  <button data-tab="accounts">Аккаунты</button>
  <button data-tab="account">Кабинет</button>
</nav>

<main id="content"></main>
<div id="toast" role="status" hidden></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
